name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.5
      - run: ruff check agent main.py tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # Todos os testes usam GitHub, LLM e RAG mockados (ver tests/) — não
      # dependem de segredos reais nem de rede, então rodam sem GITHUB_TOKEN
      # ou OPENROUTER_API_KEY configurados como secret do repositório.
      - run: pytest tests/ -v --junitxml=test-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t pr-review-agent:${{ github.sha }} .
